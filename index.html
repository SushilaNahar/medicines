function HomeTab() {
  var catState    = useState('All');    var activeCat  = catState[0];  var setActiveCat  = catState[1];
  var modalState  = useState(null);     var modalMed   = modalState[0]; var setModalMed   = modalState[1];
  var searchState = useState('');       var search     = searchState[0]; var setSearch    = searchState[1];
  var checkedState= useState({});       var checked    = checkedState[0]; var setChecked  = checkedState[1];
  var addState    = useState(false);    var showAdd    = addState[0];    var setShowAdd   = addState[1];
  var customState = useState(function(){
    try { return JSON.parse(localStorage.getItem('customMeds') || '[]'); } catch(e){ return []; }
  });
  var customMeds  = customState[0]; var setCustomMeds = customState[1];

  function handleAddSave(med) {
    var updated = customMeds.concat([med]);
    setCustomMeds(updated);
    try { localStorage.setItem('customMeds', JSON.stringify(updated)); } catch(e){}
    setShowAdd(false);
  }

  function handleDelete(id) {
    var updated = customMeds.filter(function(m){ return m.id !== id; });
    setCustomMeds(updated);
    try { localStorage.setItem('customMeds', JSON.stringify(updated)); } catch(e){}
    setModalMed(null);
  }

  var allMeds = MEDS.concat(customMeds);

  var filtered = allMeds.filter(function(m) {
    var matchCat  = activeCat === 'All' || m.cat === activeCat;
    var matchSearch = !search || m.name.toLowerCase().indexOf(search.toLowerCase()) !== -1
      || m.treats.some(function(t){ return t.toLowerCase().indexOf(search.toLowerCase()) !== -1; })
      || m.desc.toLowerCase().indexOf(search.toLowerCase()) !== -1;
    return matchCat && matchSearch;
  });

  var hPacked = Object.values(checked).filter(Boolean).length;

  return h(Fragment, null,
    // Summary bar
    h('div', { style:{ background:C.yellow, padding:'16px 20px', marginBottom:0 } },
      h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center' } },
        h('div', null,
          h('div', { style:{ fontSize:15, fontWeight:'700', color:C.text } }, 'Home Medicine Cabinet'),
          h('div', { style:{ fontSize:12, color:C.textMid, marginTop:3 } }, 'Tap any medicine for full details & dosage')
        ),
        h('div', { style:{ display:'flex', alignItems:'center', gap:10 } },
          h('div', { style:{ background:'rgba(0,0,0,0.1)', borderRadius:10, padding:'8px 14px', textAlign:'center' } },
            h('div', { style:{ fontSize:22, fontWeight:'700', color:C.text } }, hPacked+'/'+allMeds.length),
            h('div', { style:{ fontSize:11, color:C.textMid } }, 'in cabinet')
          ),
          h('button', { onClick:function(){ setShowAdd(true); }, style:{
            background:C.text, color:C.yellow, border:'none', borderRadius:12,
            width:42, height:42, fontSize:22, fontWeight:'700', cursor:'pointer',
            display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 } }, '+')
        )
      )
    ),

    // Search
    h('div', { style:{ padding:'12px 16px 0' } },
      h('input', { type:'text', placeholder:'Search medicine or symptom...', value:search,
        onChange:function(e){ setSearch(e.target.value); },
        style:{ width:'100%', padding:'11px 14px', borderRadius:12, border:'1.5px solid '+C.border,
          background:C.card, fontSize:14, color:C.text, outline:'none' } })
    ),

    // Category filter
    h('div', { style:{ display:'flex', gap:8, overflowX:'auto', padding:'12px 16px 4px',
      scrollbarWidth:'none' } },
      CATEGORIES.map(function(cat) {
        var active = activeCat === cat;
        var col = CAT_COLOR[cat];
        return h('button', { key:cat, onClick:function(){ setActiveCat(cat); }, style:{
          flexShrink:0, padding:'7px 14px', borderRadius:20, fontSize:12, fontWeight:'700',
          border:'2px solid '+(active ? (col||C.text) : C.border),
          background: active ? (col||C.text) : C.card,
          color: active ? '#fff' : C.textMid,
          whiteSpace:'nowrap',
        }}, cat);
      })
    ),

    // Medicine list
    h('div', { style:{ padding:'8px 16px 60px' } },
      filtered.length === 0 && h('div', { style:{ textAlign:'center', padding:40, color:C.textSoft } }, 'No medicines found.'),
      filtered.map(function(med) {
        var isDone = !!checked[med.id];
        return h('div', { key:med.id, style:{ background:C.card, borderRadius:14, padding:'14px',
          marginBottom:10, border:'1px solid '+C.border,
          opacity: isDone ? 0.55 : 1 } },

          h('div', { onClick:function(){ setModalMed(med); }, style:{ display:'flex', alignItems:'flex-start', gap:10, cursor:'pointer' } },
            h('div', { style:{ flex:1, minWidth:0 } },
              h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8 } },
                h('span', { style:{ fontSize:15, fontWeight:'700', color:C.text } }, med.id+'. '+med.name),
                h(TypeBadge, { type:med.type })

              h('div', { style:{ display:'flex', gap:6, marginTop:4, flexWrap:'wrap' } },
                h(Badge, { cat:med.cat }),
                med.custom && h('span', { style:{ fontSize:10, fontWeight:'700', color:'#fff', background:'#555', padding:'3px 8px', borderRadius:20 } }, '★ My Medicine')
              ),
              h('div', { style:{ fontSize:13, color:C.textMid, marginTop:6, lineHeight:1.55 } }, med.desc),
              // Treats tags
              h('div', { style:{ display:'flex', gap:5, flexWrap:'wrap', marginTop:8 } },
                med.treats.slice(0,3).map(function(t) {
                  return h('span', { key:t, style:{ fontSize:11, color:C.textMid, background:C.card2,
                    border:'1px solid '+C.border, padding:'2px 8px', borderRadius:20 } }, t);
                })

              h('div', { style:{ fontSize:11, color:C.textSoft, marginTop:8 } }, 'Tap for dosage & details →')
            )
          ),
          // Checkbox row
          h('div', { onClick:function(){ setChecked(function(p){ var n=Object.assign({},p); n[med.id]=!n[med.id]; return n; }); },
            style:{ display:'flex', alignItems:'center', gap:8, marginTop:12, paddingTop:10,
              borderTop:'1px solid '+C.border, cursor:'pointer' } },
            h('div', { style:{ width:22, height:22, borderRadius:6, border:'2px solid '+(isDone ? C.green : C.border),

              isDone && h('span', { style:{ color:'#fff', fontSize:14 } }, '✓')
            ),
            h('span', { style:{ fontSize:12, color:isDone ? C.green : C.textSoft, fontWeight:isDone?'700':'400' } },
              isDone ? 'In my cabinet ✓' : 'Mark as in cabinet')
          )
        );
      })
    ),

    h(DetailModal, { med:modalMed, onClose:function(){ setModalMed(null); },
      onDelete:handleDelete }),
    h(AddMedModal, { visible:showAdd, onClose:function(){ setShowAdd(false); }, onSave:handleAddSave })
  );
}

  var modalState   = useState(null);  var modalMed = modalState[0];   var setModalMed  = modalState[1];

  var results = selected
    ? selected.meds.map(function(id){ return MEDS.find(function(m){ return m.id === id; }); }).filter(Boolean)
    : [];

  return h(Fragment, null,
    h('div', { style:{ background:C.yellow, padding:'16px 20px' } },
      h('div', { style:{ fontSize:15, fontWeight:'700', color:C.text } }, 'What is the symptom?'),
      h('div', { style:{ fontSize:12, color:C.textMid, marginTop:3 } }, 'Tap a symptom to find the right medicine')
    ),

    h('div', { style:{ padding:'12px 16px' } },

      // Symptom grid
      h('div', { style:{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:10, marginBottom:16 } },
        SYMPTOMS.map(function(s) {
          var active = selected && selected.label === s.label;
          return h('button', { key:s.label, onClick:function(){ setSelected(active ? null : s); }, style:{
            padding:'12px 8px', borderRadius:14, border:'2px solid '+(active ? C.text : C.border),
            background: active ? C.yellow : C.card, cursor:'pointer', textAlign:'center',
          }},
            h('div', { style:{ fontSize:24, marginBottom:4 } }, s.emoji),
            h('div', { style:{ fontSize:11, fontWeight:'700', color:C.text, lineHeight:1.3 } }, s.label)
          );
        })
      ),

      // Results
      selected && h('div', null,
        h('div', { style:{ fontSize:13, color:C.textSoft, fontWeight:'700', letterSpacing:'0.06em',
          textTransform:'uppercase', marginBottom:12 } }, 'Medicines for '+selected.label),
        results.map(function(med, i) {
          var col = CAT_COLOR[med.cat] || C.textMid;
          return h('div', { key:med.id, onClick:function(){ setModalMed(med); },
            style:{ background:C.card, borderRadius:14, padding:'14px', marginBottom:10,
              border:'2px solid '+(i===0 ? C.yellow : C.border), cursor:'pointer' } },
            i===0 && h('div', { style:{ fontSize:10, fontWeight:'700', color:C.textMid, background:C.yellow,
              display:'inline-block', padding:'2px 8px', borderRadius:20, marginBottom:8 } }, '✓ FIRST CHOICE'),
            h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8 } },
              h('span', { style:{ fontSize:16, fontWeight:'700', color:C.text } }, med.name),
              h(TypeBadge, { type:med.type })
            ),
            h('div', { style:{ marginTop:4 } }, h(Badge, { cat:med.cat })),
            h('div', { style:{ fontSize:13, color:C.textMid, marginTop:8, lineHeight:1.55 } }, med.desc),
            h('div', { style:{ fontSize:12, color:C.textMid, marginTop:8, background:'#F9F9F9',
              borderRadius:8, padding:'8px 10px' } },
              h('strong', null, 'Adult: '), med.adultDose
            ),
            h('div', { style:{ fontSize:12, color:C.textMid, marginTop:4, background:'#F9F9F9',
              borderRadius:8, padding:'8px 10px' } },
              h('strong', null, 'Child: '), med.childDose
            ),
            h('div', { style:{ fontSize:11, color:C.textSoft, marginTop:8 } }, 'Tap for full details →')
          );
        })
      )
    ),

    h(DetailModal, { med:modalMed, onClose:function(){ setModalMed(null); } })
  );
}

// ── Travel Tab ────────────────────────────────────────────────────────────────
// Simple travel kit builder - just destination + days
var SIMPLE_KIT = {
  base: [
    { name:'Crocin',          type:'Tablet / Syrup', qty:'10 tablets',    desc:'Fever and headache.' },
    { name:'Dolo 600',        type:'Tablet',         qty:'6 tablets',     desc:'Stronger fever relief for adults.' },
    { name:'Combiflam',       type:'Tablet',         qty:'6 tablets',     desc:'Pain, swelling and fever together.' },
    { name:'Cyclopam',        type:'Tablet',         qty:'6 tablets',     desc:'Stomach cramps from new food.' },
    { name:'Digene',          type:'Tablet',         qty:'10 tablets',    desc:'Acidity and indigestion.' },
    { name:'Doxinate',        type:'Tablet',         qty:'8 tablets',     desc:'Nausea and motion sickness.' },
    { name:'Immodium',        type:'Tablet',         qty:'6 tablets',     desc:'Loose motions.' },
    { name:'Recofast Plus',   type:'Tablet',         qty:'8 tablets',     desc:'Cold and runny nose.' },
    { name:'Otrivin',         type:'Nasal Spray',    qty:'1 spray',       desc:'Blocked nose.' },
    { name:'Adusol',          type:'Syrup',          qty:'1 bottle',      desc:'Cough.' },
    { name:'Vicks',           type:'Ointment',       qty:'1 small jar',   desc:'Cold and chest congestion.' },
    { name:'Betadine',        type:'Ointment',       qty:'1 tube',        desc:'Cuts and wounds.' },
    { name:'Volini',          type:'Spray / Gel',    qty:'1 bottle',      desc:'Sprains and muscle pain.' },
    { name:'Iodex',           type:'Ointment',       qty:'1 tube',        desc:'Joint pain and soreness.' },
    { name:'Ciplox',          type:'Eye Drops',      qty:'1 bottle',      desc:'Eye irritation.' },
    { name:'Zinda Tilasmath', type:'Drops',          qty:'1 small bottle',desc:'Headache, cold and insect bites.' },
    { name:'ORS',             type:'Powder / Sachet', qty:'5 sachets', desc:'Critical for vomiting and diarrhoea — every doctor asks for this first.' },
    { name:'Augmentine Duo 625', type:'Tablet',      qty:'Only if prescribed', desc:'Antibiotic — doctor first.' },
  ],
  hill:   [
    { name:'Enzoflam',  type:'Tablet', qty:'6 tablets', desc:'Muscle soreness from trekking.' },
    { name:'Fklina',    type:'Tablet', qty:'8 tablets', desc:'Cold and cough in cold weather.' },
    { name:'Alex',      type:'Syrup',  qty:'1 bottle',  desc:'Sore throat from dry cold air.' },
    { name:'Myospaz',   type:'Tablet', qty:'6 tablets', desc:'Muscle spasms after long treks.' },
  ],
  beach:  [
    { name:'Candid B',  type:'Ointment', qty:'1 tube',   desc:'Fungal rash from humidity and sweat.' },
    { name:'Zole F',    type:'Ointment', qty:'1 tube',   desc:'Fungal infections in wet conditions.' },
    { name:'Allegra 180', type:'Tablet',qty:'10 tablets',desc:'Allergies and skin reactions.' },
  ],
  abroad: [
    { name:'Allegra 180', type:'Tablet', qty:'10 tablets',      desc:'Allergies in new environments.' },
    { name:'Azee',        type:'Tablet', qty:'6 tablets',       desc:'Throat infections — pharmacies abroad are expensive.' },
    { name:'Alex',        type:'Syrup',  qty:'1 bottle',        desc:'Sore throat and dry cough.' },
    { name:'Zole F',      type:'Ointment',qty:'1 tube',         desc:'Fungal infections.' },
    { name:'Doxy',        type:'Tablet', qty:'Only if prescribed', desc:'Antibiotic — ask doctor before travel.' },
    { name:'ORS',         type:'Powder / Sachet', qty:'5-10 sachets', desc:'Critical for vomiting and diarrhoea. Every doctor asks for this first.' },
    { name:'Lanzol',      type:'Capsule', qty:'5 capsules', desc:'Acidity and stomach ulcers. Take 30 mins before breakfast.' },
  ],
  long: [
    { name:'Nutrolin B Plus', type:'Capsule', qty:'1 per day', desc:'Vitamin B for long trips.' },
    { name:'Enterogermina',   type:'Capsule', qty:'6 capsules',desc:'Gut health and stomach recovery.' },
  ],
};

function TravelTab() {
  var destState     = useState(null); var dest     = destState[0];    var setDest     = destState[1];
  var daysState     = useState(5);    var days     = daysState[0];    var setDays     = daysState[1];
  var tCheckedState = useState({});   var tChecked = tCheckedState[0]; var setTChecked = tCheckedState[1];
  var builtState    = useState(false); var built   = builtState[0];   var setBuilt    = builtState[1];

  function getKit() {
    var items = SIMPLE_KIT.base.slice();
    if (dest === 'hill')   items = items.concat(SIMPLE_KIT.hill);
    if (dest === 'beach')  items = items.concat(SIMPLE_KIT.beach);
    if (dest === 'abroad') items = items.concat(SIMPLE_KIT.abroad);
    if (days > 7)          items = items.concat(SIMPLE_KIT.long);
    return items;
  }

  var kit     = built ? getKit() : [];
  var tPacked = kit.filter(function(m){ return tChecked[m.name]; }).length;
  function toggleT(name){ setTChecked(function(p){ var n=Object.assign({},p); n[name]=!n[name]; return n; }); }

  return h('div', { style:{ paddingBottom:40 } },

    // Header
    h('div', { style:{ background:C.yellow, padding:'16px 20px' } },
      h('div', { style:{ fontSize:15, fontWeight:'700', color:C.text } }, '🧳 Travel Packing List'),
      h('div', { style:{ fontSize:12, color:C.textMid, marginTop:3 } }, 'Pick your destination and trip length')
    ),

    h('div', { style:{ padding:16 } },

      // Destination
      h(Card, null,
        h(SectionLabel, { text:'Where are you going?' }),
        DESTINATIONS.map(function(d){
          return h('div', { key:d.id, onClick:function(){ setDest(d.id); setBuilt(false); }, style:{
            display:'flex', alignItems:'center', gap:14, padding:'14px 16px', borderRadius:12,
            cursor:'pointer', marginBottom:10,
            border:'2px solid '+(dest===d.id ? C.text : C.border),
            background: dest===d.id ? C.yellow : C.card2 } },
            h('span', { style:{ fontSize:26 } }, d.emoji),
            h('div', { style:{ flex:1 } },
              h('div', { style:{ fontSize:15, fontWeight:'700', color:C.text } }, d.label),
              h('div', { style:{ fontSize:12, color:C.textSoft, marginTop:2 } }, d.desc)
            ),
            dest===d.id && h('span', { style:{ color:C.green, fontSize:20, fontWeight:'700' } }, '✓')
          );
        })
      ),

      // Days
      h(Card, null,
        h(SectionLabel, { text:'How many days?' }),
        h('div', { style:{ display:'flex', gap:10, flexWrap:'wrap' } },
          [3,5,7,10,14].map(function(d){
            return h(ChoiceBtn, { key:d, label:d+' days', active:days===d,
              onClick:function(){ setDays(d); setBuilt(false); } });
          })
        )
      ),

      // Build button
      !built && h('div', { style:{ display:'flex' } },
        h(BigBtn, { label:'Show My Packing List 🎒', disabled:!dest,
          onClick:function(){ if(dest) setBuilt(true); } })
      ),

      // Kit list
      built && h(Fragment, null,
        h('div', { style:{ background:C.yellow, borderRadius:14, padding:'14px 16px', marginBottom:14,
          display:'flex', justifyContent:'space-between', alignItems:'center' } },
          h('div', null,
            h('div', { style:{ fontSize:14, fontWeight:'700', color:C.text } },
              (DESTINATIONS.find(function(d){ return d.id===dest; })||{}).label+' · '+days+' days'),
            h('div', { style:{ fontSize:12, color:C.textMid, marginTop:2 } }, 'Tap each item as you pack it')
          ),
          h('div', { style:{ background:'rgba(0,0,0,0.1)', borderRadius:10, padding:'8px 14px', textAlign:'center' } },
            h('div', { style:{ fontSize:22, fontWeight:'700', color:C.text } }, tPacked+'/'+kit.length),
            h('div', { style:{ fontSize:11, color:C.textMid } }, 'packed')
          )
        ),

        kit.map(function(item){
          var done = !!tChecked[item.name];
          return h('div', { key:item.name, onClick:function(){ toggleT(item.name); },
            style:{ display:'flex', gap:12, padding:'14px', borderRadius:12, cursor:'pointer',
              marginBottom:10, border:'1px solid '+(done ? C.green : C.border),
              background: done ? C.greenBg : C.card, opacity: done ? 0.6 : 1 } },
            h('div', { style:{ width:24, height:24, minWidth:24, borderRadius:7, marginTop:1,
              border:'2px solid '+(done ? C.green : C.border), background: done ? C.green : 'transparent',
              display:'flex', alignItems:'center', justifyContent:'center' } },
              done && h('span', { style:{ color:'#fff', fontSize:14 } }, '✓')
            ),
            h('div', { style:{ flex:1, minWidth:0 } },
              h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8 } },
                h('span', { style:{ fontSize:15, fontWeight:'700', color:C.text,
                  textDecoration: done ? 'line-through' : 'none' } }, item.name),
                h(TypeBadge, { type:item.type })
              ),
              h('div', { style:{ fontSize:12, color:C.textMid, fontWeight:'700', marginTop:4 } }, 'Qty: '+item.qty),
              h('div', { style:{ fontSize:13, color:C.textMid, marginTop:4, lineHeight:1.5 } }, item.desc)
            )
          );
        }),

        h(Note, { text:'⚠️ Antibiotics must be prescribed by a doctor. Always check with your doctor before travel.' }),
        h('div', { style:{ display:'flex', gap:10 } },
          h(BigBtn, { label:'← Start Over', onClick:function(){ setBuilt(false); setTChecked({}); setDest(null); } })
        ),
        h('div', { style:{ height:20 } })
      )
    )
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  var tabState = useState('home'); var tab = tabState[0]; var setTab = tabState[1];
  var TABS = [
    { id:'travel', label:'✈️ Travel' },
    { id:'home',   label:'🏠 Home'   },
    { id:'find',   label:'🔍 Find'   },
  ];

  return h('div', { style:{ minHeight:'100vh', background:C.bg } },
    // Header
    h('div', { style:{ background:C.yellow, padding:'20px 20px 0', textAlign:'center' } },
      h('h1', { style:{ color:C.text, fontSize:20, fontWeight:'700', margin:'0 0 2px' } }, '💊 Family Medicine App'),
      h('p', { style:{ color:C.textMid, fontSize:11, margin:'0 0 14px' } }, 'Travel Kit · Home Cabinet · Quick Find'),
      // Tab bar
      h('div', { style:{ display:'flex', background:'rgba(0,0,0,0.08)', borderRadius:'12px 12px 0 0',
        padding:'4px 4px 0' } },
        TABS.map(function(t){
          return h('button', { key:t.id, onClick:function(){ setTab(t.id); }, style:{
            flex:1, padding:'10px 6px', border:'none', cursor:'pointer', borderRadius:'10px 10px 0 0',
            background: tab===t.id ? C.card : 'transparent',
            color: tab===t.id ? C.text : C.textMid,
            fontSize:13, fontWeight: tab===t.id ? '700':'400',
          }}, t.label);
        })
      )
    ),

    // Content
    h('div', { style:{ paddingBottom:40 } },
      tab === 'travel' && h(TravelTab),
      tab === 'home'   && h(HomeTab),
      tab === 'find'   && h(QuickFindTab)
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App, null));
</script>
